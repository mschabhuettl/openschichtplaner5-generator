name: Verified release assets
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vX.Y.Z)
        required: true
        type: string
      publish:
        description: Upload verified files to the existing release
        default: false
        type: boolean
concurrency:
  group: release-assets-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Use the maintained staging code; never execute code from a downloaded artifact.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve successful main CI for the exact release commit
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const resolve = require('./tools/release_source.cjs');
            const {run, sha} = await resolve(github, context.repo, tag);
            core.setOutput('run_id', String(run.id));
            await core.summary.addHeading(`Verified source for ${tag}`)
              .addLink('Successful release gates', run.html_url)
              .addRaw(`\n\nCommit: ${sha}\n`).write();
      - name: Download verified Python files
        uses: actions/download-artifact@v4
        with:
          name: openschichtplaner5-generator-python
          path: artifacts/openschichtplaner5-generator-python
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Download verified Docker archive
        uses: actions/download-artifact@v4
        with:
          name: openschichtplaner5-generator-linux-amd64
          path: artifacts/openschichtplaner5-generator-linux-amd64
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Verify complete manifests and stage release files without rebuilding
        run: python tools/prepare_release_assets.py --artifacts artifacts --output release-files --tag "$RELEASE_TAG"
      - name: Upload without replacing existing release files
        if: github.event_name == 'release' || inputs.publish
        run: gh release upload "$RELEASE_TAG" release-files/*
      - name: Download published files again and verify their checksums
        if: github.event_name == 'release' || inputs.publish
        run: |
          gh release download "$RELEASE_TAG" --dir downloaded --pattern 'openschichtplaner5_generator-*' --pattern 'openschichtplaner5-generator-linux-amd64.tar.gz' --pattern SHA256SUMS
          cd downloaded
          cmp SHA256SUMS ../release-files/SHA256SUMS
          sha256sum -c SHA256SUMS
